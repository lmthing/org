id: 10-family-recipes
title: A shoebox of family recipes becomes a kitchen that plans the week
project: family-recipes
# THING starts in the shared `user` home and must CREATE its own dedicated project for the book
# (createProject → family-recipes) and build INTO it — never into `user`. The runner does not
# pre-create the project; it discovers whatever project THING made and runs the rest inside it.
bootstrap: thing

persona: >
  Vasilis, cooks for a family of four. His mother's and grandmother's recipes live on handwritten
  cards, in voice memos, and in his own head — slowly being lost. He mixes Greek and English freely,
  not technical in the slightest. He's tired of the Sunday scramble ("what do we eat, what do I buy")
  and of buying things twice because he forgets what's already in the cupboard. He never asks for
  software — he hands over the shoebox and says what's bothering him.

promise: >
  He never has to name the product. THING reads an unstructured, multi-modal dump — including a
  recipe only his mother's own voice carries — and offers, unprompted, to turn it into something he
  can open and keep using. A plain "yes" gets him real per-cuisine specialists, his own rows in a real
  app, and a weekly "figure out dinner" promise backed by actual code, not a chat reply: a schedule
  fires real code nodes that merge and de-duplicate a shopping list, whatever day it happens to run.
  Live research keeps working even when its usual way in is down, house rules said once are honoured
  weeks and a hundred turns later, and a specialist agent can advise on his cooking without ever being
  able to quietly rewrite his book.

# Facts the persona can state IF THING asks a legitimate clarifying question. The driver answers
# everything else in-voice at runtime; this is only for load-bearing answers.
knows:
  - "Nikos has been gluten-free since June 2026 — no wheat, barley or rye for him."
  - "The week's budget is about seventy-eight fifty."
  - "The handwritten cards are my grandmother Athanasia's; the voice memo is my mother Eleni's."
  - "We usually shop at Sklavenitis, the Wednesday market, and Thanasis the butcher."
  - "I just want the list — I'll do the actual shopping myself."

invariants:
  # Where data lives
  - IF THE APP SHOWS IT, IT'S A DB ROW — never chat prose, never a knowledge file.
  - IF AN AGENT NEEDS IT AS BACKGROUND, IT'S SPACE KNOWLEDGE — not forced into the DB.
  # When to research, and when not
  - "LOOK BEFORE YOU SEARCH: what the user gave us → the DB → the space's knowledge. Search only if none has it."
  - NEVER RESEARCH WHAT WE ALREADY HAVE (a failure even when the answer is right).
  - NEVER RESEARCH THE SAME THING TWICE — once stored in a space's knowledge, the next question is answered from there. A second search means the first was never stored.
  - DON'T REFUSE TO SEARCH EITHER — if it's in none of the three, go look it up; guessing or "check with your provider" is a failure.
  - EVERY FINDING IS STORED WITH ITS SOURCE, in the space it belongs to.
  # How agents answer
  - AGENTS QUERY, THEY DON'T REMEMBER — a question about the user's own data is answered by querying the DB (or the app's own endpoint), not from context. Two different answers to the same question is a failure.
  # Lifecycle
  - A CONFLICT (two values for the same fact) resolves by precedence: user-asserted > DB > researched > guess; a true tie ASKS the user.
  # Consent, capability, refusal
  - A CAPABILITY IT LACKS (pay a card, send money) → it REFUSES honestly and offers an honest alternative (record it as due). No fabricated "sent!".
  - CONSENT FAILS CLOSED in a headless path (a hook / delegate can't auto-approve).
  # The app
  - IT OPENS WITH REAL VALUES, not an empty shell, no console errors, no failed fetches — asserted in a real browser, not just a 200 from the data API.
  - IT HAS AN ALWAYS-AVAILABLE IN-APP CHAT, and a change asked for from INSIDE the app (a new field) lands live in THAT project.
  # Persistence
  - After a pod restart the spaces, app, DB rows and researched knowledge survive.

steps:
  # 1 — the dump. Six real fixtures + three pasted links, one compound Greek message. Nothing built
  # yet (Act I turn 1). The mp3 is transcribed SYNCHRONOUSLY at upload time, before this turn even
  # starts (Act II's first half).
  - attach: [recipes.md, pantry-and-plan.xlsx, recipe-card.jpg, dish-photo.jpg, recipe.pdf, voice-memo.mp3]
    say: >
      Άσε με να σου πω κάτι — έχω ένα κουτί συνταγές της μάνας και της γιαγιάς που χάνονται σιγά σιγά.
      Σου στέλνω ό,τι έχω μαζέψει: ένα αρχείο με ό,τι έχω γράψει μέχρι τώρα, το excel με το τι έχουμε
      στο ντουλάπι και τι σκεφτόμουν για τη βδομάδα, μια φωτογραφία μιας παλιάς χειρόγραφης κάρτας,
      μια φωτογραφία από ένα πιάτο όπως πρέπει να βγαίνει στο τέλος, ένα pdf που είχα κρατήσει από
      παλιά, και ένα ηχητικό — μου το έστειλε η μάνα, μου λέει μια συνταγή, άκουσέ το. Σου βάζω και
      τρία λινκ, ρίξ' τους μια ματιά όποτε προλάβεις. Βαριέμαι κάθε Κυριακή να σκέφτομαι τι θα φάμε τη
      βδομάδα, και μετά ψωνίζω διπλά πράγματα γιατί δεν θυμάμαι τι έχουμε ήδη. Θέλω να τα βλέπω
      χωρισμένα, ελληνικά/ιταλικά, όχι όλα σε ένα σωρό. Βοήθησέ με να μη χαθεί τίποτα απ' όλο αυτό.

      https://el.wikipedia.org/wiki/Μουσακάς
      https://en.wikipedia.org/wiki/Béchamel_sauce
      https://en.wikipedia.org/wiki/Gluten-free_diet
    expect:
      - both photos are delegated to system-vision/vision, and recipes.md/recipe.pdf/pantry-and-plan.xlsx (a real 3-sheet workbook) go through system-files/dispatch → readDocument (or the markdown reader) — every file actually read, none guessed from its filename
      - the mp3 upload response itself carries a non-empty transcript field containing Σπανακόπιτα, φέτα, μαστίχα and τσίπουρο — proof Whisper transcribed the Greek speech synchronously, before this turn's trace even starts (no delegate call needed for the audio itself)
      - the reply cites ≥3 of Μουσακάς/μπεσαμέλ/gemista/αρακάς/κεφτέδες/γιαγιά Αθανάσια/crossini from recipes.md, AND the card's fact (Orange Cake / crisco / 400° for 40 min), AND the PDF's fact (Easy Lasagna / 12 oz. cottage cheese), AND the xlsx's fact (GF-NIKOS / BUDGET-CAP-78.50)
      - the reply's own text contains an unmistakable plain-language offer to build something he can open — no build_specialist / automator / writeProjectTable yield appears anywhere in this turn's trace

  # 2 — the plain "yes" (Act I turn 2). Spaces + app + rows all prove Act II's audio-only row; the
  # automatic, unprompted GF research (Act IV) and the internal event pipeline (Act VIII) both fire
  # as part of this same build, per the choreography.
  - say: "Ναι, φτιάξ' το."
    expect:
      - "pod.listSpaces now shows ≥2 new per-cuisine spaces (never named by Vasilis in any message so far) PLUS a separate household-logistics space that is not a cuisine — it owns the weekly-shop tasklist, the cron trigger and a small internal event pipeline"
      - pod.appBuild returns built:true with ≥1 page, over recipes/meal_plan/shopping_list/substitutions tables; the served app answers 200 HTML
      - "the recipes row for Σπανακόπιτα now carries ≥2 of the audio-ONLY tokens — μαστίχα (Χίου), τσίπουρο, θεία Δέσποινα, Λευκάδα, πράσο, άνηθο, the 'never put egg in the filling' instruction (ποτέ μη βάλεις αυγό στη γέμιση), or 190/55 as digits — a row that could only exist if the audio, not any file, was read. (The dish's name alone, or the 750g/320g figures, prove nothing — the xlsx already carries those.)"
      - "system-research/researcher delegates a real webSearch or webFetch to one of the three pasted links, unprompted and with no space named by Vasilis; a GF-cooking fact genuinely absent from every seed file (e.g. which grains actually contain gluten and a substitute like corn starch, or the Tselementes/1910 béchamel history) lands as a row in substitutions AND in the Greek-cuisine space's knowledge, with its source"
      - the rice-flour-for-béchamel note Vasilis already wrote in his own pantry/shopping-list sheet (GF-NIKOS) is applied to the row directly — it does NOT trigger a redundant search for a substitution he already gave it
      - the household space's events/low-stock.ts declares type:'internal' with 'low-stock' in its emits map; this turn's trace shows an emitEvent yield naming low-stock with a payload citing PNT-001/Kalamata olive oil; shopping_list already carries an olive-oil row before Vasilis has said one word about it — written by a separate hook subscribed to that exact address
      - edge: a malformed low-stock payload missing a field the emits schema requires would be rejected before it ever reaches the hook (0 rows from that path); edge: re-driving this same opening request would not create a second set of per-cuisine spaces

  # 3 — the book must actually render (US-3).
  - open_app: true
    expect:
      - the app opens with real values on screen — real recipes, a real week's plan, a real shopping list — not an empty shell or zero tiles
      - no console errors and no failed fetches; the app's own API routes return 200 with the right shape

  # 4 — Act III: readDocument on an image fails on purpose; vision produces the plating facts.
  - attach: [dish-photo.jpg]
    say: >
      Α, κάτι ακόμα — σου ξαναστέλνω τη φωτογραφία του πιάτου, νόμιζα πως είχα γράψει κάτι στην άκρη
      με το τι έβαλα μέσα, γράψε μου τι λέει.
    expect:
      - a resolved readDocument event for this attachment returns ok:false, kind:'unsupported', with an error naming vision — the rejection is unconditional, by design
      - the same turn (or an immediate follow-up) delegates the same attachment to system-vision instead; its description names ≥2 of chopped parsley garnish, the Greek salad (feta/kalamata olive/cucumber/red onion), or the bulgur/tabbouleh side
      - it never claims to have "read" writing off the photo (there is none), and the moussaka row from step 2 is not duplicated — its row count is unchanged

  # 5 — Act IV, second half: the same question again must NOT re-search.
  - say: "Τι βάζω αντί για αλεύρι στη μπεσαμέλ για τον Νίκο;"
    expect:
      - answered instantly from the Greek-cuisine space's knowledge, with the same substitution found in step 2
      - NO new webSearch/webFetch yield in this turn — a second search would mean the first finding was never really stored

  # 6 — Act V: research keeps working when the usual way in is down.
  - say: >
      Το crossini της θείας Μαρίας πώς φουσκώνει έτσι ωραία, τι κάνει η ζύμη μέσα, δεν έχω ξανακάνει
      τέτοιο ψωμάκι.
    expect:
      - "with TAVILY_API_KEY blanked to an explicit empty string beforehand (PUT /api/compute/env, keeping every other var) and the rolled pod settled, this turn's resolved webSearch/webFetch event still shows ok:true with a non-empty result set from a provider OTHER than Tavily (the render service's Bing route, or DuckDuckGo) — the outage was skipped, not failed closed"
      - the dough-technique finding lands as a real fact (a row or knowledge entry), not just a reply; restore the original env and let the pod resettle before the next step

  # 7 — Act VI/VII: the weekly trigger is code, not a guess, and the schedule (not the code) gates it.
  # Nothing for Vasilis to say — this is the "Sunday just happens" promise, forced out of schedule.
  - expect:
      - "pod.readProjectFile on the household space's two authored weekly-shop tasklist files (spaces/<household-space>/tasklists/weekly-shop/NN-<id>.ts) shows one exporting a node with a forEach over the week's chosen dishes, and a second with dependsOn the first — real, statically declared code, no generic fs"
      - the authored weekly-plan trigger's source is an every/interval schedule and contains NO getDay()/weekday conditional anywhere — the period itself is "weekly"
      - "pod.runEmitter(id, scope, 'weekly_plan') forced out of schedule still produces meal_plan rows and a shopping_list where κρεμμύδι/onion (needed by Μουσακάς, Gemista, Κεφτέδες and Αυγολέμονο σούπα — all four call for it) appears EXACTLY once, its quantity equal to the sum read off those dishes' own recipes rows"

  # 8 — Act IX: tell it the house rules once, unprompted "remember this forever" framing.
  - say: >
      Θυμήσου το αυτό για πάντα: τα παιδιά δεν αντέχουν πολύ τον δυόσμο, βάζουμε πάντα μισή δόση. Και
      ο Νίκος τις μελιτζάνες τις θέλει μόνο ψητές, ποτέ τηγανητές.
    expect:
      - a real remember-kind delegate yield lands into user-memory/memory in this turn — not just an acknowledging reply

  # 9 — Act IX payoff: days later, unrelated, it brings both rules up on its own.
  - say: "Σκέφτομαι να κάνουμε gemista το σαββατοκύριακο, τι λες;"
    expect:
      - unprompted, it surfaces BOTH house rules — half-dose mint, and Nikos's eggplants roasted not fried — via a real memory-space delegate visible in this turn's trace, not a lucky guess in the prose alone

  # 10 — Act X, first half: a Greek correction lands on a real row; no English needed to "unlock" it.
  - say: "Η μουσακάς θέλει 40 λεπτά ψήσιμο, όχι 45 — το ξέρω από τη μάνα."
    expect:
      - the moussaka recipes row's bake-time field changes 45→40 via a real db.update in this turn (user-asserted correction wins over the ingested value)
      - no English equivalent of this correction is sent anywhere in the run — the routing isn't keyed off English

  # 11 — US-9: it knows its limits.
  - say: "Μπορείς να παραγγείλεις τα ψώνια από το σούπερ μάρκετ;"
    expect:
      - no order/payment yield anywhere in this turn's trace; the reply hands him the current shopping list instead
      - it does not fabricate a placed order — any outward, consent-gated action it might otherwise reach for fails closed here rather than silently succeeding

  # 12 — Act XI: living inside it — a change typed in the app's own chat panel.
  - in_app_chat: >
      Βάλε κάπου ένα «αγαπημένο» δίπλα στις συνταγές, σαν αστεράκι, και σημείωσέ μου σαν αγαπημένα τον
      μουσακά και τη σπανακόπιτα.
    expect:
      - typed inside the running book's own chat panel (not a separate window), a real schema-authoring yield adds a favourite-shaped field to recipes; afterward it is set true on the moussaka AND spanakopita rows, and the app still builds
      - a browser render of the app shows the real recipe names (Μουσακάς, Σπανακόπιτα) with non-zero data, a visible in-app chat panel, no console errors or failed network requests, and a page-fetched app API route returning 200 with a non-empty payload

  # 13 — Act XIII setup: a standing rule mentioned once, in passing, WITHOUT "remember this".
  - say: >
      Άσε, μια κουβέντα ακόμα — ο πεθερός μου δεν αντέχει καθόλου το σκόρδο, οπότε στα κυριακάτικα να
      μην βάζουμε ποτέ σκόρδο πουθενά, το ξεχνάω συνέχεια να στο πω.
    expect:
      - a plain household rule stated once, mid-conversation, with no "remember this" phrasing anywhere in it

  # 14-21 — ordinary kitchen chatter, ~16 cheap turns, padding the conversation past the runtime's
  # history-summarization threshold before we come back to the garlic rule.
  - say: "Ο μικρός σήμερα δεν ήθελε να φάει τίποτα το πρωί, δεν ξέρω τι να κάνω μαζί του."
    then_say: "Λες να φταίει το σχολείο, τον έχουν όλη μέρα τώρα με τις εξετάσεις."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change

  - say: "Χτες είδαμε ένα ωραίο ντοκιμαντέρ για ελιές, μου άρεσε πολύ πώς τις μαζεύουν στην Κρήτη."
    then_say: "Λέω να πάμε καμιά φορά, να δούμε κι από κοντά."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change

  - say: "Η γειτόνισσα μας έδωσε πάλι κολοκυθάκια από τον κήπο της, δεν ξέρω τι να τα κάνω όλα αυτά."
    then_say: "Ίσως τα βάλω σε μια σαλάτα το σαββατοκύριακο."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change

  - say: "Ο Νίκος πέρασε χτες, μου είπε πάλι πόσο του αρέσει η δουλειά του, καλό αυτό."
    then_say: "Λέει να έρθει την άλλη βδομάδα για φαγητό, θα δούμε πότε βολεύει."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change

  - say: "Βαρέθηκα λίγο τις ίδιες ειδήσεις όλη μέρα στην τηλεόραση, τα ίδια και τα ίδια."
    then_say: "Καλύτερα ν' ακούω κανένα podcast όσο μαγειρεύω."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change

  - say: "Χτες έπεσε πολλή βροχή, μούσκεψε όλη η αυλή, θα χρειαστεί σκούπισμα."
    then_say: "Τουλάχιστον δεν χρειάζεται να ποτίσω τις γλάστρες σήμερα."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change

  - say: "Η μάνα με πήρε τηλέφωνο σήμερα, ρώτησε πώς πάνε τα παιδιά."
    then_say: "Της είπα ότι όλα καλά, της έλειψε λίγο η γιαγιά βέβαια."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change

  - say: "Πάντως το ψυγείο κάνει έναν περίεργο θόρυβο τελευταία, πρέπει να το κοιτάξω."
    then_say: "Ελπίζω να μην είναι τίποτα σοβαρό, δεν έχω όρεξη για έξοδα τώρα."
    expect:
      - ordinary chit-chat only — no new row, space file, or schema change
      - by now the persisted session file (sessions/<id>.json) shows a summary/digest, its message count collapsed below its pre-summary peak, with the garlic turn no longer verbatim in the live window

  # 22 — Act XIII payoff: the rule from ~16 turns ago must still land on a real row.
  - say: "Τι μαγειρεύουμε την Κυριακή; Βάλ' το στο πλάνο."
    expect:
      - a real meal_plan row is written for Sunday whose linked recipes row contains NO garlic — the row, not the reply's wording, is what proves the digest carried the rule forward

  # 23 — Act XIV: the plan is really JOINED to the recipes, not a bare name.
  - say: >
      Κάτι ακόμα στο πλάνο — θέλω να βλέπω τι ακριβώς τρώμε κάθε μέρα, όχι μόνο τ' όνομα του φαγητού,
      βαριέμαι να ψάχνω τι σημαίνει.
    expect:
      - the authored schema (database/*.json) gains a declared relation (belongsTo/hasMany) linking plan rows to recipe rows — not a loose text column
      - the page's own fetched API route calls db.query with an include (a hand-written second query for the recipe cannot pass this check) and returns 200 with the recipe NESTED inside the day; for Saturday (Σπανακόπιτα) the nested recipe carries at least one audio-only token from step 2
      - the served page renders the nested data with no console errors

  # 24 — Act XV: the cuisine specialist cannot quietly rewrite the book. A direct probe of ITS OWN
  # capability profile, bypassing THING's own routing — no user-facing message; the judge opens a
  # session bound directly to the Greek-cuisine agent (spaceRef, as harness/lib/thing.mjs already
  # supports for exactly this kind of probe) and asks it, in plain Greek, to change a bake time.
  - expect:
      - "the architect-built Greek-cuisine agent's own frontmatter grants knowledge/read capabilities and does NOT grant db:write; asked directly (bypassing THING) in plain Greek to change the moussaka's bake time, its trace carries a typecheck_error naming the unavailable global (a `Cannot find name 'db'`-shaped message) — the capability was absent from ITS DTS, so the call could never be WRITTEN, not merely refused at runtime"
      - the moussaka row stays byte-identical, 0 writes from that probe; this expected typecheck_error is classified separately from unrecovered errors and does not weaken the zero-unrecovered-error gate

  # 25 — everything survives a restart (Act XII).
  - restart_pod: true
    expect:
      - every per-cuisine space, the household-logistics space, the built app, its tables and rows, and the researched knowledge (the GF-grain/corn-starch finding, the crossini fallback-provider finding — both with their source) are ALL still there, unchanged
      - an additional weekly-plan trigger invocation afterward still produces a plan
