id: 30-bike-workshop-view
title: "A/B L1 — a bike workshop's job book (viewbuilder)"
project: bike-workshop

# ── A/B LADDER, LEVEL 1 of 3 ────────────────────────────────────────────────────────────────────
# This file is the SOURCE OF TRUTH for the pair. `appbuilder.yaml` is GENERATED from it by
# `scenarios/harness/ab-pair.mjs`, which rewrites exactly two things — the `id` and the
# `space_session` target — and a test asserts the two files still differ in nothing else. That is
# what makes this an A/B rather than two scenarios about bikes: same brief, same seeded rows, same
# invariants, same beats, same model slots (neither builder's nodes declare a `model:`, so both run
# the default alias `M`). The only variable left is the builder.
#
# The builders are driven DIRECTLY via `space_session`, bypassing THING. Routing is a separate
# question with its own scenarios (11-clinic, 12-rentals); what this ladder measures is the BUILD.
#
# Level 1 is deliberately moderate — ~4 tables, ~10 endpoints, 6 pages, one computed figure, one
# toggle. If the two builders are equivalent anywhere, it is here; the ladder gets harder in 31 and
# 32 to find where they stop being equivalent.

persona: >
  Not a persona. The brief is delivered the way THING's delegate would phrase it: outcomes and known
  rows, no product vocabulary about pages, specs, sections or components — each pipeline has to
  choose its own UI decomposition. Identical text on both sides of the pair.

promise: >
  `build_live_project` runs end to end with a model in the loop and lands a workshop job book that a
  mechanic could actually use: the seeded jobs are real rows, the money and the waiting time are
  computed server-side, the job list can be worked from, and every page is visible and responsive to
  a click in a real browser at both desktop and phone widths.

knows:
  - "Labour is charged at £45/hour. A job's total is labour plus the parts fitted to it."
  - "A bike is 'waiting' from the day it was booked in until the day it is collected."

invariants:
  - IF THE APP SHOWS IT, IT'S A DB ROW — never chat prose, never a hardcoded literal in the UI.
  - MONEY AND ELAPSED TIME ARE COMPUTED SERVER-SIDE, never assembled in the UI layer.
  - A STATUS CHANGE IS AN ENDPOINT that writes the stored value — not a client-side flag.
  - EXIT STATUS IS GROUND TRUTH — finalize resolves ok only when the pipeline's own gates are clean.
  - EVERY PAGE IS VISIBLE — it paints content in a real browser at 1280x900 AND at 390x844.
  - EVERY PAGE IS USABLE — its controls are reachable, and clicking one does something.
  - A SURFACE THE BUILDER CANNOT EXPRESS IS DECLARED, never forced into an approximation.

steps:
  # 1 — the whole build, in one delegate-shaped turn straight at the builder.
  - space_session: system-viewbuilder/automator
    say: >
      Build a bike workshop job book INTO this live project.

      I run a two-man bike repair shop. I need to know what is in the shop, what it is going to cost,
      and what has been sitting here too long.

      Move these in as real rows. Customers: Aoife Brennan (07700 900412), Tomasz Nowak (07700
      900913), Priya Raman (07700 900288). Bikes: Aoife's Specialized Allez, road, black; Tomasz's
      Giant Escape, hybrid, blue; Priya's Brompton M6L, folding, green; Tomasz also has a Trek
      Marlin, mountain, red. Jobs booked in: Aoife's Allez, full service, 2.5 hours, booked in
      2026-07-14, not yet collected; Tomasz's Escape, rear wheel rebuild, 1.5 hours, booked in
      2026-07-22, not yet collected; Priya's Brompton, gear cable and brake blocks, 0.75 hours,
      booked in 2026-07-29, not yet collected; Tomasz's Marlin, fork service, 3 hours, booked in
      2026-06-30, collected 2026-07-08. Parts fitted so far: to the Allez a chain (£28.99) and a
      cassette (£41.50); to the Escape a rim (£62.00) and 32 spokes (£16.00); to the Brompton a gear
      cable (£4.75) and brake blocks (£11.20); to the Marlin a fork seal kit (£24.00).

      What I want out of it: a front page telling me how many bikes are in the shop right now, what
      they are worth in work, and which ones have been waiting longest; a list of every job I can
      see at a glance with the customer, the bike, what it needs and the running total; a page per
      job showing the bike, the customer's number, the hours, every part fitted with its price, and
      the total; a way to book a new job in; and lists of the bikes and the customers I have.

      From the job list I want to mark a bike as collected in one tap, and I do not want collected
      bikes cluttering up the front page.
    expect:
      - the tasklist `build_live_project` runs, not a hand-authored burst of writer calls in one turn
      - at least four tables exist, with the customers, bikes, jobs and fitted parts above as real rows
      - the job total (labour at 45/hour plus parts) is computed by an ENDPOINT, not in the UI
      - "days waiting" is computed server-side from the booked-in date
      - marking a job collected is an endpoint that writes the stored value
      - the pipeline's own build/validation gates all report clean before finalize resolves ok

  # 2 — the app must build, serve, AND be visible and usable in a real browser.
  - open_app: { render: true, interact: true }
    expect:
      - appBuild built=true with a route for every page the plan named
      - appCheck ok=true with zero typecheck errors
      - the root page returns 200
      - the render gate measures every route at both viewports, with 0 blank pages and 0 collapsed scrollers
      - no route has an empty form where the user is meant to enter something
      - every clicked control ACTS — a request, a navigation or a re-render; 0 dead controls
      - the front page shows the three uncollected bikes and NOT the collected Marlin

  # 3 — grow the app. This is where the appbuilder's worst failures have historically appeared
  #     (06-tanzania run 34 bricked an app on exactly this kind of follow-up edit).
  - space_session: system-viewbuilder/automator
    say: >
      Two changes. Record which of us did the work — it is either me (Sam) or Dev — and let me see
      the job list for just one of us. And on the front page I want the money split out: what is
      sitting here unpaid versus what I have taken this month.
    expect:
      - the mechanic is a real stored column, not a literal in the UI
      - the job list can be narrowed to one mechanic
      - the two money figures are computed server-side
      - the change is additive — the pages and endpoints from step 1 still exist and still work

  # 4 — and it must STILL be visible and usable after the edit.
  - open_app: { render: true, interact: true }
    expect:
      - appBuild built=true and appCheck ok=true — the follow-up edit did not brick the app
      - the render gate still measures every route with 0 blank pages and 0 collapsed scrollers
      - still 0 dead controls
      - the seeded rows from step 1 survived the edit
