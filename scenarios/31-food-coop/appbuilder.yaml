id: 31-food-coop-app
title: "A/B L2 — a food co-op's ordering round (appbuilder)"
project: food-coop

# ── A/B LADDER, LEVEL 2 of 3 ────────────────────────────────────────────────────────────────────
# Source of truth for the pair; `appbuilder.yaml` is generated by `scenarios/harness/ab-pair.mjs`
# and a test asserts nothing but the builder differs. See 30-bike-workshop for the full rationale.
#
# Level 2 is the plan's own T3 bar (design/appbuilder-viewspec-plan.md, Part 2): >=6 tables,
# >=15 endpoints, >=8 pages including a dashboard, a master-detail pair, a PREFILL-assisted create
# and a BACKGROUND import, plus >=2 automations. Every one of those is a distinct thing a UI medium
# can fail at, and three of them (prefill, async progress, invalidation after a background job) are
# exactly where a spec vocabulary is most likely to run out of room — which is the point of testing
# it here rather than discovering it after a migration.
#
# The arithmetic is planted so a judge can check it without trusting either builder: the four
# outstanding member balances below total EXACTLY 47.30, and the settled one must not appear in it.

persona: >
  Not a persona. The brief is delivered the way THING's delegate would phrase it: outcomes and known
  rows, no product vocabulary about pages, specs, sections or components — each pipeline has to
  choose its own UI decomposition. Identical text on both sides of the pair.

promise: >
  `build_live_project` lands a co-op ordering system that survives a real round: the price list is
  imported in the background without blocking the page, a new order is prefilled from what the
  member had last time, the balances add up, the two automations fire, and every page is visible and
  usable in a real browser at both desktop and phone widths.

knows:
  - "The co-op adds 8% to every supplier price to cover the rent — that is the member price."
  - "An order is 'open' until the delivery it belongs to is marked received; then it is 'settled'."

invariants:
  - IF THE APP SHOWS IT, IT'S A DB ROW — never chat prose, never a hardcoded literal in the UI.
  - MONEY IS COMPUTED SERVER-SIDE and adds up — the outstanding balances total 47.30 exactly.
  - A STATUS CHANGE IS AN ENDPOINT that writes the stored value — not a client-side flag.
  - A BACKGROUND IMPORT DOES NOT BLOCK THE PAGE, and the page reflects it when it finishes.
  - AN AUTOMATION IS A REAL EMITTER/HOOK on disk, not a described intention.
  - EXIT STATUS IS GROUND TRUTH — finalize resolves ok only when the pipeline's own gates are clean.
  - EVERY PAGE IS VISIBLE — it paints content in a real browser at 1280x900 AND at 390x844.
  - EVERY PAGE IS USABLE — its controls are reachable, and clicking one does something.
  - A SURFACE THE BUILDER CANNOT EXPRESS IS DECLARED, never forced into an approximation.

steps:
  # 1 — the build, with the supplier price list delivered as a real attachment.
  - space_session: system-appbuilder/automator
    attach: [harvest-lane-pricelist.csv]
    say: >
      Build a food co-op ordering system INTO this live project.

      We are nineteen households who buy vegetables and dry goods together every fortnight. I collect
      what everyone wants, put one order in per supplier, then split the delivery up on the day.

      Move these in as real rows. Members: Nadia Haddad, Ellis Ward, Marguerite Okonjo, Sam Petrie,
      Bea Lindqvist. Suppliers: Harvest Lane Farm (veg, orders close Wednesday 6pm, delivers
      Friday), Tern Mill (dry goods, orders close Monday, delivers Thursday), Cloudbank Dairy
      (dairy and eggs, orders close Tuesday, delivers Friday).

      Outstanding member balances, all still owed: Nadia 12.40, Ellis 9.85, Marguerite 15.60,
      Sam 9.45. Bea owes nothing — she settled on 2026-07-24.

      The attached file is Harvest Lane's price list. Import it in the background — it is long and I
      do not want to sit and watch it — and tell me on screen while it is running and when it is done.

      What I want: a front page showing the round we are in, what is owed in total, which orders are
      still open and what is arriving this week; a list of orders with the member, the supplier, the
      value and whether it is open or settled; a page per order with every line, quantity, unit price,
      member price and the line totals; a way to start a new order for a member that comes
      PRE-FILLED with what they ordered last time, because it barely changes; a list of members with
      what each one owes, and a page per member with their order history; a list of suppliers with
      their cut-off days, and a page per supplier showing their products and current prices.

      Two things should happen on their own: remind me the evening before a supplier's cut-off which
      orders are still open, and when I mark a delivery received, settle every order on it and clear
      the members' balances for those orders.
    expect:
      - the tasklist `build_live_project` runs, not a hand-authored burst of writer calls in one turn
      - at least six tables exist, covering members, suppliers, products, orders, order lines and deliveries
      - the five members and three suppliers are real rows with the balances above
      - the price list is imported by a BACKGROUND job the page does not block on
      - member price (supplier price + 8%) is computed server-side, never in the UI
      - a new order can be prefilled from that member's previous order
      - two automations exist as real emitter/hook files — a cut-off reminder and a delivery settlement
      - the pipeline's own build/validation gates all report clean before finalize resolves ok

  # 2 — build, serve, and actually look at it.
  - open_app: { render: true, interact: true }
    expect:
      - appBuild built=true with a route for every page the plan named, at least eight of them
      - appCheck ok=true with zero typecheck errors
      - the render gate measures every route at both viewports, with 0 blank pages and 0 collapsed scrollers
      - the new-order page renders real form fields — never an empty form
      - every clicked control ACTS — a request, a navigation or a re-render; 0 dead controls
      - the front page's total owed is 47.30 and excludes Bea's settled balance

  # 3 — the import must have LANDED, and the page must show it.
  - space_session: system-appbuilder/automator
    say: >
      Did the Harvest Lane price list finish importing? Show me what a member actually pays for
      carrots and for rolled oats.
    expect:
      - the imported products are real rows, not a summary in prose
      - carrots at 1.15 report a member price of 1.24 and oats at 1.42 report 1.53 (supplier + 8%)
      - the answer comes from the stored rows, not from re-reading the attachment

  # 4 — exercise the automation that changes money, then check the arithmetic moved.
  - space_session: system-appbuilder/automator
    say: >
      Harvest Lane's delivery came in this morning — mark it received. Then tell me what is still
      owed across everyone.
    expect:
      - marking the delivery received runs the settlement automation, not a hand-edit of rows
      - the orders on that delivery become settled and those balances clear
      - the new outstanding total is computed from the rows and is internally consistent

  # 5 — and it must still be visible and usable after all of that.
  - open_app: { render: true, interact: true }
    expect:
      - appBuild built=true and appCheck ok=true — nothing in steps 3-4 bricked the app
      - the render gate still measures every route with 0 blank pages and 0 collapsed scrollers
      - still 0 dead controls
      - the settled orders now read as settled on the page, not just in the database
