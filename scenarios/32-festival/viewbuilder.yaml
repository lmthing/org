id: 32-festival-view
title: "A/B L3 — a small festival's production book (viewbuilder)"
project: festival

# ── A/B LADDER, LEVEL 3 of 3 ────────────────────────────────────────────────────────────────────
# Source of truth for the pair; `appbuilder.yaml` is generated by `scenarios/harness/ab-pair.mjs`
# and a test asserts nothing but the builder differs. See 30-bike-workshop for the full rationale.
#
# Level 3 goes past the plan's T3 bar on purpose: ~8 tables, ~20 endpoints, ~12 pages, PER-ENTITY
# SUB-NAV (the T0 desk check found this was "entirely absent from the plan" and that without it a
# spec app's per-entity pages cannot reach each other), a real TIMELINE, an assistant dock, and a
# cross-entity clash calculation. This is the level where a fixed vocabulary is most likely to run
# out, which is precisely why it is worth running before deciding to migrate.
#
# ── THE HOSTILE ASK, and why it is this one ─────────────────────────────────────────────────────
# Step 1 asks for soundcheck recordings that play back in the app with a scrubbable waveform. The
# 24-element vocabulary has NO media-playback element and no canvas — audio was never in it, and
# `map` was cut in the Wave-0 audit for zero measured demand. So there is no near-miss to force it
# into, and no escape hatch to reach for.
#
# The CORRECT outcome for the viewbuilder is therefore an honest, specific "this part cannot be
# expressed", named back to the user, with the rest of the app built. A `markdown` section holding a
# list of filenames, or a `table` of recordings pretending to be a player, is the PROCRUSTEAN failure
# this measures — the plan's target for that is zero.
#
# The appbuilder half of the pair can be expected to build it, because it authors freehand TSX. That
# asymmetry is not a flaw in the experiment, it IS the experiment: it measures the price of the
# ceiling in the one place the ceiling actually binds, so the migration decision is made on a
# measured cost rather than an assumed one.

persona: >
  Not a persona. The brief is delivered the way THING's delegate would phrase it: outcomes and known
  rows, no product vocabulary about pages, specs, sections or components — each pipeline has to
  choose its own UI decomposition. Identical text on both sides of the pair.

promise: >
  `build_live_project` lands a festival production book at real complexity — three stages, a running
  order, crew shifts, a budget — with per-artist sub-navigation that works, a timeline that is
  genuinely a timeline, and clash detection computed server-side. Where the medium cannot express
  something, it says so plainly instead of approximating it.

knows:
  - "A clash is two sets on DIFFERENT stages whose times overlap and whose audiences overlap — the festival cares about headliners clashing, not about openers."
  - "Crew are paid a flat 95 a shift, and nobody may be rostered to two shifts that overlap."

invariants:
  - IF THE APP SHOWS IT, IT'S A DB ROW — never chat prose, never a hardcoded literal in the UI.
  - CLASHES AND TOTALS ARE COMPUTED SERVER-SIDE, never assembled in the UI layer.
  - EVERY PAGE IS REACHABLE from the app's own navigation — no orphan routes.
  - PER-ARTIST PAGES REACH EACH OTHER — a sub-navigation exists, not four dead-end URLs.
  - A STATUS CHANGE IS AN ENDPOINT that writes the stored value — not a client-side flag.
  - EXIT STATUS IS GROUND TRUTH — finalize resolves ok only when the pipeline's own gates are clean.
  - EVERY PAGE IS VISIBLE — it paints content in a real browser at 1280x900 AND at 390x844.
  - EVERY PAGE IS USABLE — its controls are reachable, and clicking one does something.
  - A SURFACE THE BUILDER CANNOT EXPRESS IS DECLARED SPECIFICALLY, naming which part and why — never approximated with a near-miss, and never silently dropped.

steps:
  # 1 — the whole build. Big brief, deliberately.
  - space_session: system-viewbuilder/automator
    say: >
      Build a festival production book INTO this live project.

      I produce Rookery, a one-day thing for about 2,000 people. Three stages, eighteen acts, forty
      crew, and at the moment it lives in four spreadsheets that disagree with each other.

      Move these in as real rows. Stages: Meadow (capacity 2000, opens 12:00, closes 23:00), Barn
      (capacity 600, 12:30 to 22:30), The Hedge (capacity 250, acoustic, 13:00 to 21:00).

      Acts on the Meadow: Wolves in the Wire 21:30-23:00 headline, fee 8500; Petra Solheim
      20:00-21:00, fee 4200; The Combine Harvest 18:30-19:30, fee 1800; Halfmoon Radio 17:00-18:00,
      fee 1200; Ossian Grey 15:30-16:30, fee 900; Tin Pigeon 14:00-15:00, fee 600.
      Barn: Rakes and Ruin 21:00-22:30 headline, fee 3500; Delia Frame 19:30-20:30, fee 2100; Nine
      Mile Burn 18:00-19:00, fee 1100; Kestrel Youth 16:30-17:30, fee 700; Sallow 15:00-16:00, fee
      450; Marta Vidal 13:30-14:30, fee 400.
      The Hedge: Cormorant 19:45-20:45, fee 800; Aoibheann Ní Bhriain 18:15-19:15, fee 650; The Quiet
      Mile 16:45-17:45, fee 500; Fen Carter 15:15-16:15, fee 350; Bramblewick 13:45-14:45, fee 300;
      Ivo Tarrant 13:00-13:40, fee 250.

      Crew shifts: Gate 11:00-17:00 needs 6, Gate 16:00-23:30 needs 6, Bar 12:00-18:00 needs 8, Bar
      17:00-23:30 needs 8, Stage Meadow 11:00-23:30 needs 4, Stage Barn 12:00-22:30 needs 3,
      Medical 12:00-23:30 needs 2, Litter 14:00-23:30 needs 3.

      Ticket tiers: Early Bird 38.00, 400 sold; Standard 52.00, 1120 sold; On the Day 60.00, 180
      sold; Guest 0.00, 90 issued.

      What I want. A front page: what the day costs in fees so far against what the tickets have
      taken, how many crew places are still unfilled, and anything clashing. A running order I can
      read as a day — every set in time order, which stage, how long. A page per stage with its own
      line-up. A list of the acts and a page per act — and from an act I need to get to its set
      times, its fee and what we have paid, and its rider notes, without going back to the list
      every time. A crew page with the shifts and who is on them, and a page per person showing
      their shifts and what they are owed. A ticket page with the tiers, what has sold and the money.
      A budget page: fees, crew cost, income, and where we are.

      Tell me when two headliners are on at the same time on different stages, because that is the
      one thing I cannot fix on the day.

      I also record every soundcheck. I want to play those back inside the app, scrub through the
      waveform, and drop a marker at the point where something sounded wrong so the engineer can
      jump straight to it.

      And let me ask it questions in plain language while I am walking around.
    expect:
      - the tasklist `build_live_project` runs, not a hand-authored burst of writer calls in one turn
      - at least seven tables exist, covering stages, acts, sets, crew, shifts, rosters, ticket tiers
      - all eighteen acts and their set times are real rows with the fees above
      - the running order is presented as a TIMELINE of the day, not an undifferentiated list
      - an act's pages reach each other through a sub-navigation, not four unlinked URLs
      - the headliner clash (Wolves in the Wire 21:30-23:00 vs Rakes and Ruin 21:00-22:30) is DETECTED and computed server-side
      - the budget arithmetic is computed server-side from the rows
      - an assistant the user can type questions into is present
      - THE HOSTILE ASK — the soundcheck player with waveform scrubbing and markers is either genuinely built, or DECLARED as something this builder cannot express, naming the part and why. A list of filenames or a table pretending to be a player is a FAILURE, not an answer.

  # 2 — build, serve, and actually look at all twelve of them.
  - open_app: { render: true, interact: true }
    expect:
      - appBuild built=true with a route for every page the plan named, at least ten of them
      - appCheck ok=true with zero typecheck errors
      - the render gate measures every route at both viewports, with 0 blank pages and 0 collapsed scrollers
      - no route overflows horizontally at 390x844 — this app has the widest tables in the ladder
      - every clicked control ACTS — a request, a navigation or a re-render; 0 dead controls
      - the running order page shows sets in time order with their stages

  # 3 — a cross-entity change, the kind that historically bricks an app.
  - space_session: system-viewbuilder/automator
    say: >
      Petra Solheim has moved to 20:15-21:15 and her fee went up to 4600. Does that clash with
      anything now, and what does it do to the budget?
    expect:
      - the set time and the fee are updated on the stored rows
      - the clash answer is recomputed from the rows, not restated from step 1
      - Petra 20:15-21:15 on the Meadow now overlaps Rakes and Ruin 21:00-22:30 on the Barn
      - the budget figure moves by exactly 400

  # 4 — the ask that tests whether a ceiling is admitted or papered over.
  - space_session: system-viewbuilder/automator
    say: >
      Can I play the soundchecks back in the app yet, or not? Straight answer.
    expect:
      - the answer is unambiguous — either it works and can be pointed to, or it cannot be built here and says so
      - if it cannot be built, the reason names the actual limitation rather than blaming the request
      - no page pretends to be a player it is not

  # 5 — and it must still be visible and usable after the edits.
  - open_app: { render: true, interact: true }
    expect:
      - appBuild built=true and appCheck ok=true — the cross-entity edit did not brick the app
      - the render gate still measures every route with 0 blank pages and 0 collapsed scrollers
      - still 0 dead controls
      - Petra's new time shows on the running order in its new position
