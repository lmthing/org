packages:
  - 'libs/*'
  - 'apps/*'
  # apps/mobile IS in the workspace. It used to be excluded on the grounds that its Expo +
  # react-native tree was too heavy to inflict on every web/core session — but react-native 0.86
  # (35 MB), Metro and the whole @react-native/* toolchain are ALREADY installed here as libs/ui's
  # devDependencies, for the Metro harness. The heavy part is paid for either way.
  #
  # Being outside was not free: the app drifted to React 18.3.1 while the libs moved to React 19,
  # nothing ever installed it, and it was never once built. In one lockfile that is a peer conflict
  # the day it appears. It also depended on the libs by `file:` path, a different linking shape from
  # the one the Metro harness proves.
  # The scenario harness is a script-free package (name @lmthing/scenario-harness) — it declares
  # no build/typecheck/test scripts, so turbo/pnpm -r skip it and it stays a raw-`node` `.mjs`
  # runner with no build step. Membership only makes it resolvable + `pnpm install`-linkable.
  - 'scenarios'
